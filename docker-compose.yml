# 사용법:
#   전체 테스트:      docker compose run --rm test
#   특정 폴더만:      docker compose run --rm test pytest tests/test_login.py
services:
  test:
    build: .
    environment:
      - CI=true
      - TZ=Asia/Seoul
    volumes:
      # 리포트/결과물을 호스트에서 바로 확인할 수 있게 마운트 (둘 다 디렉터리 — 단일 파일 마운트는 금지)
      - ./test-results:/app/test-results
      - ./reports:/app/reports

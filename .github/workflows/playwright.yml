# Playwright 테스트 CI — push/PR 마다 전체 테스트 실행 후 HTML 리포트를 아티팩트로 업로드
name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Actions 탭에서 수동 실행 가능
  workflow_dispatch:
  # 야간 회귀 — 코드 변경이 없어도 매일 1회 실행해 대상 사이트(saucedemo) 변화와
  # 플레이키 테스트를 감지한다. cron 은 UTC 기준이며 기본 브랜치에서만 동작한다.
  #   '40 21 * * *' = UTC 21:40 = KST 06:40 (출근 전 결과 확보)
  #   정시(:00)는 GitHub 부하가 커 지연되므로 일부러 40분으로 둔다.
  schedule:
    - cron: '40 21 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: 의존성 설치
        run: pip install -e .

      - name: Playwright 브라우저 설치
        run: python -m playwright install --with-deps chromium

      # 값에 콜론(:)이 있으면 YAML 이 "키: 값" 구분자로 오인하므로 반드시 따옴표로 감싼다
      - name: "테스트 실행 (CI: 실패 시 2회 재시도)"
        run: python -m pytest --reruns 2

      - name: 리포트 업로드 (실패 시에도 항상)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            reports/
            test-results/
          retention-days: 30

# Playwright 테스트 CI — push/PR 마다 전체 테스트 실행 후 HTML 리포트를 아티팩트로 업로드
name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Actions 탭에서 수동 실행 가능
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: 의존성 설치
        run: pip install -e .

      - name: Playwright 브라우저 설치
        run: python -m playwright install --with-deps chromium

      - name: 테스트 실행 (CI: 실패 시 2회 재시도)
        run: python -m pytest --reruns 2

      - name: 리포트 업로드 (실패 시에도 항상)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            reports/
            test-results/
          retention-days: 30
